<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="container">

        <!-- LEFT SIDE FORM -->

        <div id="form-container">

            <h1>Student Form</h1>

            <form id="studentForm">

                <!-- NAME -->

                <label for="name">
                    Name
                </label>

                <input type="text" id="name" placeholder="Enter your name">

                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input type="email" id="email" placeholder="Enter your email">

                <!-- GENDER -->

                <div id="gender">

                    <p style="padding-bottom: 5px;">Gender</p>

                    <input type="radio" name="gender" value="Male">
                    Male

                    <input type="radio" name="gender" value="Female">
                    Female

                </div>

                <!-- HOBBIES -->

                <div id="hobbies">

                    <p style="padding-bottom: 5px;">Hobbies</p>

                    <input type="checkbox" name="hobby" value="Reading">
                    Reading

                    <input type="checkbox" name="hobby" value="Sports">
                    Sports

                    <input type="checkbox" name="hobby" value="Travelling">
                    Travelling

                </div>

                <!-- COUNTRY -->

                <label for="country">
                    Country
                </label>

                <select id="country">

                    <option value="">
                        Select Country
                    </option>

                </select>

                <!-- STATE -->

                <label for="state">
                    State
                </label>

                <select id="state">

                    <option value="">
                        Select State
                    </option>

                </select>

                <!-- CITY -->

                <label for="city">
                    City
                </label>

                <select id="city">

                    <option value="">
                        Select City
                    </option>

                </select>

                <!-- BUTTONS -->

                <div id="buttons">

                    <button type="submit" id="saveBtn">
                        Save
                    </button>

                    <button type="button" id="cancelBtn">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

        <!-- RIGHT SIDE -->

        <div id="right-section">

            <!-- SEARCH + SORT -->

            <div class="search-container">

                <input id="searchInput" type="text" placeholder="Search by name...">

                <select id="sortSelect">

                    <option value="">
                        Sort By Name
                    </option>

                    <option value="asc">
                        Ascending
                    </option>

                    <option value="desc">
                        Descending
                    </option>

                </select>

            </div>

            <!-- TABLE -->

            <div id="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Gender</th>

                            <th>Hobbies</th>

                            <th>Country</th>

                            <th>State</th>

                            <th>City</th>

                            <th>Delete</th>

                            <th>Edit</th>

                        </tr>

                    </thead>

                    <tbody id="studentList">

                    </tbody>

                </table>

            </div>
            <div id="pagination">

                <button id="prevBtn">
                    Prev
                </button>

                <span id="pageNumber">
                    Page 1
                </span>

                <button id="nextBtn">
                    Next
                </button>

            </div>

        </div>

    </div>

    <script src="data.js"></script>

    <script src="script.js"></script>

</body>

</html>
